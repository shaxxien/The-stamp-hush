<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#2A3A29"/>
  <!-- Stamp perforated border ring -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#AAC0A5" stroke-width="4" stroke-dasharray="12 12"/>
  <rect x="36" y="36" width="440" height="440" rx="60" fill="none" stroke="#F4F7F4" stroke-width="2"/>
  
  <!-- Arched bridge arc -->
  <path d="M 96 340 Q 256 160 416 340" fill="none" stroke="#F4F7F4" stroke-width="12" stroke-linecap="round"/>
  <path d="M 120 340 Q 256 210 392 340" fill="none" stroke="#AAC0A5" stroke-width="6" stroke-linecap="round"/>
  <!-- Bridge pillars -->
  <line x1="160" y1="290" x2="160" y2="340" stroke="#AAC0A5" stroke-width="6"/>
  <line x1="210" y1="240" x2="210" y2="340" stroke="#AAC0A5" stroke-width="6"/>
  <line x1="302" y1="240" x2="302" y2="340" stroke="#AAC0A5" stroke-width="6"/>
  <line x1="352" y1="290" x2="352" y2="340" stroke="#AAC0A5" stroke-width="6"/>

  <!-- Microscope icon in center -->
  <g transform="translate(256, 260) scale(1.1)" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Eyepiece tube -->
    <line x1="20" y1="-90" x2="-20" y2="-40" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="28" cy="-100" r="10" fill="#FFFFFF"/>
    <!-- Revolving nosepiece -->
    <circle cx="-20" cy="-40" r="14" fill="#AAC0A5"/>
    <line x1="-28" y1="-30" x2="-38" y2="-15" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Stage -->
    <line x1="-70" y1="5" x2="20" y2="5" stroke="#FFFFFF" stroke-width="12"/>
    <line x1="-50" y1="0" x2="-10" y2="0" stroke="#81A27B" stroke-width="6"/>
    <!-- Curved arm -->
    <path d="M 0 -60 C 50 -50, 60 20, 20 50" stroke="#FFFFFF" stroke-width="14"/>
    <!-- Base -->
    <line x1="-70" y1="65" x2="50" y2="65" stroke="#FFFFFF" stroke-width="14"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="bold" fill="#F4F7F4" letter-spacing="4">THE STAMP BRIDGE</text>
  <text x="256" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#AAC0A5" letter-spacing="2">MEDTECH SANCTUARY</text>
</svg>
